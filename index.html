<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy.

      The bundle is fully self-contained (no CDN, no remote scripts) and only
      talks to the Rust backend over Tauri IPC, so most sources can be locked
      down hard. The two `unsafe-*` allowances exist only so Vite's dev-mode
      HMR (which injects inline scripts and uses eval to wrap modules) keeps
      working in development; the production bundle never triggers them.

      If you ever add a third-party script/font/image source, widen the
      matching directive here rather than falling back to "*" — keeping a
      tight CSP is one of the cheapest defenses against XSS we have.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost ws://localhost:3001 https://api.github.com; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none';"
    />
    <title>MCP Switch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
